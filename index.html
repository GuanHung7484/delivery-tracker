<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>外送收入管家</title>
<style>
  :root{
    --bg:#0d0d0f;
    --card:#1c1c1e;
    --card2:#2a2a2c;
    --line:#333336;
    --txt:#ffffff;
    --txt2:#9a9aa0;
    --txt3:#6a6a70;
    --orange:#ff9f0a;
    --green:#2dd36f;   /* Uber Eats */
    --pink:#e9266d;    /* foodpanda */
    --lala:#ff6a00;    /* Lalamove */
    --gray:#8e8e93;    /* 其他 */
    --up:#2dd36f;
    --down:#ff453a;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"Segoe UI Variable","Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:calc(110px + var(--safe-bot));}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px;}

  /* ---------- 標題 ---------- */
  header{padding:calc(18px + var(--safe-top)) 16px 12px;text-align:center;}
  header .app{color:var(--orange);font-size:21px;font-weight:700;letter-spacing:.3px;}
  header .app .ver{color:var(--txt3);font-size:14px;font-weight:600;margin-left:6px;}
  header .rule{height:1px;background:var(--line);margin:12px 4px 0;}

  /* ---------- 日期列 ---------- */
  .datebar{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 6px;}
  .datebar button{background:var(--card);border:none;color:var(--txt);width:40px;height:40px;
    border-radius:12px;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .datebar button:active{background:var(--card2);}
  .datebar .date{font-size:25px;font-weight:700;min-width:200px;text-align:center;}
  .today-btn{display:block;margin:0 auto 6px;background:none;border:none;color:var(--orange);
    font-size:14px;font-weight:600;cursor:pointer;}

  /* ---------- 卡片通用 ---------- */
  .card{background:var(--card);border-radius:18px;padding:18px 20px;margin:12px 0;}

  /* ---------- 平台收入總覽 ---------- */
  .sum-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;}
  .sum-row .l{display:flex;align-items:center;gap:13px;font-size:19px;font-weight:600;}
  .dot{width:13px;height:13px;border-radius:50%;flex:none;}
  .sum-row .v{font-size:19px;font-weight:700;}
  .sum-row .v.zero{color:var(--txt3);font-weight:600;}
  .sum-row .v.has{color:var(--orange);}
  .sum-line{height:1px;background:var(--line);margin:8px 0;}
  .sum-total{display:flex;align-items:center;justify-content:space-between;padding-top:6px;}
  .sum-total .l{font-size:26px;font-weight:800;}
  .sum-total .v{font-size:30px;font-weight:800;color:var(--orange);}

  /* ---------- 數據格 ---------- */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:12px 0;}
  .stat{background:var(--card);border-radius:16px;padding:15px 8px 13px;text-align:center;}
  .stat .num{font-size:23px;font-weight:800;line-height:1.15;white-space:nowrap;}
  .stat .num.small{font-size:19px;}
  .stat .delta{font-size:12.5px;font-weight:600;margin-top:5px;white-space:nowrap;}
  .stat .delta.up{color:var(--up);}
  .stat .delta.down{color:var(--down);}
  .stat .delta.flat{color:var(--txt3);}
  .stat .lbl{font-size:14.5px;color:var(--txt2);margin-top:6px;font-weight:600;}

  /* ---------- 圓餅圖 ---------- */
  .donut-wrap{display:flex;flex-direction:column;align-items:center;padding:24px 0 8px;}
  .donut{position:relative;width:230px;height:230px;}
  .donut svg{transform:rotate(-90deg);}
  .donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut .center .t{font-size:15px;color:var(--txt2);}
  .donut .center .a{font-size:30px;font-weight:800;color:var(--orange);margin-top:2px;}
  .legend{width:100%;margin-top:18px;}
  .legend .row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:16px;}
  .legend .row .l{display:flex;align-items:center;gap:11px;font-weight:600;}
  .legend .row .r{display:flex;align-items:center;gap:14px;}
  .legend .row .pct{color:var(--txt2);font-weight:600;}
  .legend .row .amt{color:var(--orange);font-weight:700;min-width:64px;text-align:right;}
  .empty{color:var(--txt3);font-size:16px;text-align:center;padding:28px 0;}

  /* ---------- 編輯按鈕 ---------- */
  .fab{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(22px + var(--safe-bot));z-index:30;
    background:var(--orange);color:#1a1200;border:none;border-radius:30px;
    padding:15px 30px;font-size:18px;font-weight:800;cursor:pointer;
    box-shadow:0 6px 22px rgba(255,159,10,.35);}
  .fab:active{transform:translateX(-50%) scale(.97);}

  /* ---------- 編輯面板 ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;}
  .overlay.show{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
    border-radius:22px 22px 0 0;max-height:90vh;overflow-y:auto;
    transform:translateY(100%);transition:transform .25s ease;
    padding:8px 18px calc(26px + var(--safe-bot));max-width:480px;margin:0 auto;}
  .sheet.show{transform:translateY(0);}
  .sheet .handle{width:42px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 6px;}
  .sheet h2{font-size:21px;font-weight:800;text-align:center;margin:6px 0 4px;}
  .sheet .sub{text-align:center;color:var(--txt2);font-size:14px;margin-bottom:14px;}
  .field{margin:14px 0;}
  .field .flbl{font-size:15px;color:var(--txt2);font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:9px;}
  .field .inputs{display:flex;gap:10px;}
  .field .inputs .one{flex:1;position:relative;}
  .field input,.plat-block input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:13px 14px;font-size:18px;font-weight:600;outline:none;}
  .field input:focus,.plat-block input:focus{border-color:var(--orange);}
  .unit{position:absolute;right:13px;top:50%;transform:translateY(-50%);
    color:var(--txt3);font-size:15px;font-weight:600;pointer-events:none;}
  .plat-block{background:var(--card2);border-radius:14px;padding:13px 14px;margin:11px 0;}
  .plat-block .head{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:700;margin-bottom:11px;}
  .plat-block .duo{display:flex;gap:10px;}
  .plat-block .duo .one{flex:1;position:relative;}
  .plat-block input{background:var(--bg);}
  .plat-block .mini{font-size:12.5px;color:var(--txt3);margin-bottom:5px;font-weight:600;}
  .actions{display:flex;gap:11px;margin-top:18px;}
  .actions button{flex:1;border:none;border-radius:13px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;}
  .btn-save{background:var(--orange);color:#1a1200;}
  .btn-cancel{background:var(--card2);color:var(--txt);}
  .btn-clear{background:none;color:var(--down);font-size:14px;font-weight:600;display:block;
    margin:14px auto 0;border:none;cursor:pointer;}
  .logo{width:26px;height:26px;flex:none;}
  .stat .delta.est{color:var(--orange);font-weight:700;}
  .field .note{font-size:12.5px;color:var(--txt3);margin-top:7px;line-height:1.55;}
  .field .flbl .opt{color:var(--txt3);font-size:12.5px;font-weight:600;margin-left:8px;}

  /* ---------- 本月統計 ---------- */
  .month-head{font-size:18px;font-weight:800;margin-bottom:6px;}
  .month-total{font-size:34px;font-weight:800;color:var(--orange);line-height:1.1;}
  .month-sub{font-size:14.5px;color:var(--txt2);margin:7px 0 2px;font-weight:600;}
  .month-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0 4px;}
  .mbox{background:var(--card2);border-radius:12px;padding:12px 13px;}
  .mbox .mn{font-size:19px;font-weight:800;}
  .mbox .ml{font-size:13.5px;color:var(--txt2);margin-top:4px;font-weight:600;}
  .best-day{background:#2a2410;border:1px solid #5a4a16;color:var(--orange);border-radius:12px;
    padding:13px 15px;font-size:16.5px;font-weight:800;margin:13px 0 2px;
    display:flex;justify-content:space-between;align-items:center;}
  .bars-cap{font-size:13px;color:var(--txt2);font-weight:600;margin:18px 0 9px;}
  .bars{display:flex;align-items:flex-end;gap:2px;height:92px;}
  .bar{flex:1;background:var(--card2);border-radius:3px 3px 0 0;min-height:3px;}
  .bar.has{background:var(--green);}
  .bar.cur{background:var(--orange);}
  .month-empty{color:var(--txt3);font-size:15px;text-align:center;padding:14px 0;line-height:1.6;}

  /* ---------- 頁籤 ---------- */
  .tabs{display:flex;gap:6px;background:var(--card);border-radius:14px;padding:5px;
    margin:8px auto 4px;max-width:280px;}
  .tabs button{flex:1;border:none;background:none;color:var(--txt2);font-size:16px;
    font-weight:700;padding:11px;border-radius:10px;cursor:pointer;}
  .tabs button.active{background:var(--orange);color:#1a1200;}

  /* ---------- 成本 / 淨收入 ---------- */
  .sum-row .v.cost{color:var(--down);font-weight:700;}
  .sum-net{display:flex;align-items:center;justify-content:space-between;padding-top:8px;margin-top:2px;}
  .sum-net .l{font-size:22px;font-weight:800;}
  .sum-net .v{font-size:26px;font-weight:800;color:var(--green);}

  /* ---------- 備份 ---------- */
  .backup{display:flex;gap:11px;}
  .backup button{flex:1;background:var(--card2);border:none;color:var(--txt);
    border-radius:13px;padding:15px;font-size:15.5px;font-weight:700;cursor:pointer;}
  .backup button:active{background:var(--line);}
  .backup-note{font-size:12.5px;color:var(--txt3);line-height:1.6;}
</style>
</head>
<body>

<header>
  <div class="app">外送收入管家<span class="ver">v1.3</span></div>
  <div class="rule"></div>
</header>

<div class="wrap">
  <div class="datebar">
    <button id="prevDay" aria-label="前一天">‹</button>
    <div class="date" id="dateText">—</div>
    <button id="nextDay" aria-label="後一天">›</button>
  </div>
  <button class="today-btn" id="todayBtn">回到今天</button>

  <!-- 日報 / 月報 切換 -->
  <div class="tabs">
    <button id="tabDay" class="active">日報</button>
    <button id="tabMonth">月報</button>
  </div>

  <!-- 日報 -->
  <div id="dayView">
    <!-- 平台收入總覽 -->
    <div class="card" id="summaryCard"></div>
    <!-- 數據格 -->
    <div class="grid" id="statGrid"></div>
    <!-- 圓餅圖 -->
    <div class="card">
      <div id="donutArea"></div>
    </div>
  </div>

  <!-- 月報 -->
  <div id="monthView" style="display:none">
    <div class="card" id="monthCard"></div>
  </div>

  <!-- 資料備份 -->
  <div class="card">
    <div class="month-head">💾 資料備份</div>
    <div class="backup-note" style="text-align:left;margin:4px 0 13px">把所有紀錄存成 CSV（可用 Excel 打開）。換手機、清除瀏覽器前先「匯出」，之後「匯入」就能還原。</div>
    <div class="backup">
      <button id="btnExport">⬇️ 匯出備份</button>
      <button id="btnImport">⬆️ 匯入備份</button>
    </div>
    <input type="file" id="importFile" accept=".csv,text/csv" style="display:none">
  </div>
</div>

<button class="fab" id="editFab">✏️ 編輯今日</button>

<!-- 編輯面板 -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <h2 id="sheetTitle">編輯資料</h2>
  <div class="sub">填當天的工時、里程，與各平台收入、單量</div>

  <div class="field">
    <div class="flbl">⏱️ 上線工時</div>
    <div class="inputs">
      <div class="one"><input type="number" inputmode="numeric" id="in_h" placeholder="0" min="0"><span class="unit">小時</span></div>
      <div class="one"><input type="number" inputmode="numeric" id="in_m" placeholder="0" min="0" max="59"><span class="unit">分鐘</span></div>
    </div>
  </div>

  <div class="field">
    <div class="flbl">🛵 總里程<span class="opt">留空＝自動估算</span></div>
    <div class="inputs">
      <div class="one"><input type="number" inputmode="decimal" id="in_km" placeholder="留空會自動估算" min="0" step="0.01"><span class="unit">km</span></div>
    </div>
    <div class="note">有碼表數字就填這格（最準）。留空的話，App 會用下面「每單平均公里 × 單量」自動估算。</div>
  </div>

  <div class="field">
    <div class="flbl">📐 每單平均公里<span class="opt">設定一次就好</span></div>
    <div class="inputs">
      <div class="one"><input type="number" inputmode="decimal" id="in_avgkm" placeholder="例如 2.5" min="0" step="0.1"><span class="unit">km/單</span></div>
    </div>
    <div class="note">自動估算用。例如平均每單跑 2.5 公里就填 2.5，會套用到所有「沒填總里程」的日子；隨時可調。</div>
  </div>

  <div class="field">
    <div class="flbl">💸 當日成本<span class="opt">用來算淨收入，沒有可留空</span></div>
    <div class="inputs">
      <div class="one"><input type="number" inputmode="numeric" id="in_fuel" placeholder="0" min="0"><span class="unit">油錢</span></div>
      <div class="one"><input type="number" inputmode="numeric" id="in_cost" placeholder="0" min="0"><span class="unit">其他</span></div>
    </div>
    <div class="note">油錢、保養、停車等花費。淨收入 ＝ 總收入 － 成本。</div>
  </div>

  <div id="platInputs"></div>

  <div class="actions">
    <button class="btn-cancel" id="btnCancel">取消</button>
    <button class="btn-save" id="btnSave">儲存</button>
  </div>
  <button class="btn-clear" id="btnClear">清除這天的資料</button>
</div>

<script>
/* ===== 平台設定（含可愛 LOGO）===== */
const PLATFORMS = [
  { key:'uber', name:'Uber Eats', color:'var(--green)', hex:'#2dd36f',
    logo:`<svg class="logo" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#2dd36f"/><path d="M20 9c-6.1 0-11 4.9-11 11s4.9 11 11 11 11-4.9 11-11S26.1 9 20 9zm0 4.6a6.4 6.4 0 0 1 6.3 5.2H13.7A6.4 6.4 0 0 1 20 13.6zM13.4 21h13.2A6.4 6.4 0 0 1 20 26.4 6.4 6.4 0 0 1 13.4 21z" fill="#06381c"/></svg>` },
  { key:'panda', name:'FoodPanda', color:'var(--pink)', hex:'#e9266d',
    logo:`<svg class="logo" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#e9266d"/><circle cx="13" cy="13.5" r="4.6" fill="#3a0a1c"/><circle cx="27" cy="13.5" r="4.6" fill="#3a0a1c"/><ellipse cx="20" cy="23" rx="9.5" ry="8.5" fill="#fff"/><circle cx="16" cy="22" r="1.8" fill="#3a0a1c"/><circle cx="24" cy="22" r="1.8" fill="#3a0a1c"/><ellipse cx="20" cy="26.5" rx="2.3" ry="1.7" fill="#3a0a1c"/></svg>` },
  { key:'lala', name:'Lalamove', color:'var(--lala)', hex:'#ff6a00',
    logo:`<svg class="logo" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#ff6a00"/><rect x="8" y="16" width="14" height="9" rx="1.5" fill="#fff"/><path d="M22 19h4.2l3.8 4v2H22z" fill="#fff"/><circle cx="14" cy="27" r="2.6" fill="#3a1c00"/><circle cx="14" cy="27" r="1" fill="#fff"/><circle cx="26" cy="27" r="2.6" fill="#3a1c00"/><circle cx="26" cy="27" r="1" fill="#fff"/></svg>` },
  { key:'other', name:'其他', color:'var(--gray)', hex:'#8e8e93',
    logo:`<svg class="logo" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#8e8e93"/><circle cx="13" cy="20" r="2.4" fill="#fff"/><circle cx="20" cy="20" r="2.4" fill="#fff"/><circle cx="27" cy="20" r="2.4" fill="#fff"/></svg>` },
];

/* ===== 資料存取 ===== */
const STORE_KEY = 'gonzo_delivery_v1';
function loadAll(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); }catch(e){ return {}; } }
function saveAll(d){ localStorage.setItem(STORE_KEY, JSON.stringify(d)); }

/* ===== 設定（每單平均公里，跨日共用）===== */
const SET_KEY = 'gonzo_settings_v1';
function getSettings(){ try{ return JSON.parse(localStorage.getItem(SET_KEY)||'{}'); }catch(e){ return {}; } }
function saveSettings(s){ localStorage.setItem(SET_KEY, JSON.stringify(s)); }

let DATA = loadAll();
let current = new Date();           // 目前檢視的日期

/* ===== 日期工具 ===== */
const WD = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function prettyDate(d){ return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${WD[d.getDay()]}`; }
function shiftDay(n){ const d=new Date(current); d.setDate(d.getDate()+n); current=d; render(); }

/* ===== 取得某天資料 / 計算指標 ===== */
function dayRecord(key){
  const r = DATA[key] || {};
  const p = {};
  PLATFORMS.forEach(pl=>{ const pr=(r.platforms&&r.platforms[pl.key])||{}; p[pl.key]={income:+pr.income||0, orders:+pr.orders||0}; });
  return { hours:+r.hours||0, km:+r.km||0, fuel:+r.fuel||0, other:+r.other||0, platforms:p };
}
function metrics(rec){
  let income=0, orders=0;
  PLATFORMS.forEach(pl=>{ income+=rec.platforms[pl.key].income; orders+=rec.platforms[pl.key].orders; });
  const h=rec.hours;
  // 里程：有手填就用手填；沒填則用「每單平均公里 × 單量」自動估算
  const avgKm = +getSettings().avgKmPerOrder || 0;
  let km = rec.km, kmEstimated = false;
  if(km<=0 && avgKm>0 && orders>0){ km = orders*avgKm; kmEstimated = true; }
  const cost = (rec.fuel||0) + (rec.other||0);
  const net = income - cost;
  return {
    income, orders, hours:h, km, kmEstimated, cost, net,
    hourly: h>0 ? income/h : 0,
    perKm:  km>0 ? income/km : 0,
    ordPerHr: h>0 ? orders/h : 0,
    avgOrder: orders>0 ? income/orders : 0,
    netHourly: h>0 ? net/h : 0,
  };
}

/* ===== 格式化 ===== */
function money(n){ return '$'+Math.round(n).toLocaleString('en-US'); }
function money2(n){ return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* ===== 渲染 ===== */
function render(){
  const key = ymd(current);
  document.getElementById('dateText').textContent = prettyDate(current);

  const rec = dayRecord(key);
  const m = metrics(rec);

  // 前一天（用於比較）
  const prev = new Date(current); prev.setDate(prev.getDate()-1);
  const mPrev = metrics(dayRecord(ymd(prev)));
  const hasPrev = (mPrev.income||mPrev.hours||mPrev.km||mPrev.orders) > 0;

  /* --- 收入總覽 --- */
  let sum = '';
  PLATFORMS.forEach(pl=>{
    const v = rec.platforms[pl.key].income;
    sum += `<div class="sum-row"><div class="l"><span class="dot" style="background:${pl.color}"></span>${pl.name}</div>
            <div class="v ${v>0?'has':'zero'}">${money(v)}</div></div>`;
  });
  sum += `<div class="sum-line"></div>
          <div class="sum-total"><div class="l">合計</div><div class="v">${money(m.income)}</div></div>`;
  if(m.income>0 || m.cost>0){
    sum += `<div class="sum-row" style="padding-top:10px"><div class="l">💸 成本</div><div class="v cost">－${money(m.cost)}</div></div>
            <div class="sum-net"><div class="l">淨收入</div><div class="v">${money(m.net)}</div></div>`;
  }
  document.getElementById('summaryCard').innerHTML = sum;

  /* --- 比較字串 --- */
  function deltaPct(cur,prv){ if(!hasPrev||prv===0) return null; return (cur-prv)/prv*100; }
  function deltaAbs(cur,prv){ if(!hasPrev) return null; return cur-prv; }
  function fmtDelta(val, kind){
    if(val===null) return `<span class="delta flat">—</span>`;
    const up = val>0.0001, down = val<-0.0001;
    const arrow = up?'▲':(down?'▼':'＝');
    const cls = up?'up':(down?'down':'flat');
    const a = Math.abs(val);
    let txt='';
    if(kind==='pct') txt = a.toFixed(1)+'%';
    else if(kind==='money') txt = '$'+Math.round(a).toLocaleString('en-US');
    else if(kind==='hr') txt = a.toFixed(1)+'hr';
    else if(kind==='km') txt = a.toFixed(1)+'km';
    else if(kind==='order') txt = Math.round(a)+'單';
    else if(kind==='dec') txt = a.toFixed(1);
    return `<span class="delta ${cls}">${arrow} ${txt} vs 昨日</span>`;
  }

  /* --- 數據格（8 格全部都有 vs 昨日 比較；里程估算時數字前加 ≈）--- */
  const km0 = m.kmEstimated?'≈':'';
  const stats = [
    { num:money(m.income),         delta:fmtDelta(deltaPct(m.income,mPrev.income),'pct'),     lbl:'日收入',  big:true },
    { num:m.hours.toFixed(1)+'hr', delta:fmtDelta(deltaAbs(m.hours,mPrev.hours),'hr'),        lbl:'總工時' },
    { num:money2(m.hourly),        delta:fmtDelta(deltaAbs(m.hourly,mPrev.hourly),'money'),    lbl:'時薪',   small:true },
    { num:m.orders+'單',           delta:fmtDelta(deltaAbs(m.orders,mPrev.orders),'order'),    lbl:'總單量' },
    { num:km0+m.km.toFixed(2)+'km', delta:fmtDelta(deltaAbs(m.km,mPrev.km),'km'),              lbl:'里程',   small:true },
    { num:km0+money2(m.perKm),      delta:fmtDelta(deltaAbs(m.perKm,mPrev.perKm),'money'),     lbl:'每公里', small:true },
    { num:m.ordPerHr.toFixed(1),   delta:fmtDelta(deltaAbs(m.ordPerHr,mPrev.ordPerHr),'dec'),  lbl:'均單量' },
    { num:money2(m.avgOrder),      delta:fmtDelta(deltaAbs(m.avgOrder,mPrev.avgOrder),'money'), lbl:'均單價', small:true },
    { num:money2(m.netHourly),     delta:fmtDelta(deltaAbs(m.netHourly,mPrev.netHourly),'money'), lbl:'淨時薪', small:true },
  ];
  document.getElementById('statGrid').innerHTML = stats.map(s=>
    `<div class="stat"><div class="num ${s.small?'small':''}" style="${s.big?'color:var(--orange)':''}">${s.num}</div>
     ${s.delta}<div class="lbl">${s.lbl}</div></div>`).join('');

  /* --- 圓餅圖 --- */
  renderDonut(rec, m.income);

  /* --- 本月統計 --- */
  renderMonth();
}

function renderDonut(rec, total){
  const area = document.getElementById('donutArea');
  if(total<=0){ area.innerHTML = `<div class="empty">這天還沒有收入資料<br>按下方「✏️ 編輯今日」開始記帳</div>`; return; }

  const R=90, C=2*Math.PI*R, W=26;
  let off=0, circles='';
  const segs = PLATFORMS.map(pl=>({pl, val:rec.platforms[pl.key].income})).filter(s=>s.val>0);
  segs.forEach(s=>{
    const len = s.val/total*C;
    circles += `<circle cx="115" cy="115" r="${R}" fill="none" stroke="${s.pl.hex}" stroke-width="${W}"
                 stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`;
    off += len;
  });

  let legend = '';
  segs.forEach(s=>{
    const pct = (s.val/total*100).toFixed(1);
    legend += `<div class="row"><div class="l"><span class="dot" style="background:${s.pl.hex}"></span>${s.pl.name}</div>
               <div class="r"><span class="pct">${pct}%</span><span class="amt">${money(s.val)}</span></div></div>`;
  });

  area.innerHTML = `
    <div class="donut-wrap">
      <div class="donut">
        <svg width="230" height="230" viewBox="0 0 230 230">
          <circle cx="115" cy="115" r="${R}" fill="none" stroke="#2a2a2c" stroke-width="${W}"/>
          ${circles}
        </svg>
        <div class="center"><div class="t">Total</div><div class="a">${money(total)}</div></div>
      </div>
      <div class="legend">${legend}</div>
    </div>`;
}

/* ===== 本月統計 ===== */
function monthMetrics(year, month){           // month 為 0~11
  let income=0, orders=0, hours=0, km=0, cost=0, days=0, anyEst=false;
  let best={day:null, income:0};
  const daily=[];
  const daysInMonth = new Date(year, month+1, 0).getDate();
  for(let d=1; d<=daysInMonth; d++){
    const key = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const mm = metrics(dayRecord(key));
    daily.push({day:d, income:mm.income});
    const worked = mm.income>0 || mm.orders>0 || mm.hours>0;
    if(worked){
      income+=mm.income; orders+=mm.orders; hours+=mm.hours; km+=mm.km; cost+=mm.cost; days++;
      if(mm.kmEstimated) anyEst=true;
      if(mm.income>best.income) best={day:d, income:mm.income};
    }
  }
  return { year, month, daysInMonth, daily, income, orders, hours, km, cost, net:income-cost, days, anyEst, best,
    avgDaily: days>0?income/days:0,
    hourly:   hours>0?income/hours:0,
    perKm:    km>0?income/km:0,
    avgOrder: orders>0?income/orders:0 };
}
function mbox(n,l){ return `<div class="mbox"><div class="mn">${n}</div><div class="ml">${l}</div></div>`; }
function renderMonth(){
  const y=current.getFullYear(), mo=current.getMonth();
  const M=monthMetrics(y,mo);
  let html = `<div class="month-head">📅 本月統計 · ${y}年${mo+1}月</div>`;
  if(M.days===0){
    document.getElementById('monthCard').innerHTML =
      html + `<div class="month-empty">這個月還沒有記錄<br>記了之後就會自動幫你統計整月 📊</div>`;
    return;
  }
  const e = M.anyEst?'≈':'';
  html += `<div class="month-total">${money(M.income)}</div>
           <div class="month-sub">出勤 ${M.days} 天 · 平均日收入 ${money(M.avgDaily)}</div>
           <div class="month-grid">
             ${mbox(M.hours.toFixed(1)+'hr','總工時')}
             ${mbox(money2(M.hourly),'平均時薪')}
             ${mbox(M.orders+'單','總單量')}
             ${mbox(e+M.km.toFixed(1)+'km','總里程')}
             ${mbox(e+money2(M.perKm),'平均每公里')}
             ${mbox(money2(M.avgOrder),'平均單價')}
             ${M.cost>0?mbox(money(M.cost),'本月成本'):''}
             ${M.cost>0?mbox(money(M.net),'本月淨收入'):''}
           </div>
           <div class="best-day"><span>🏆 最佳一天　${mo+1}/${M.best.day}</span><span>${money(M.best.income)}</span></div>`;
  const maxInc = Math.max(1, ...M.daily.map(d=>d.income));
  let bars='';
  M.daily.forEach(d=>{
    const h = d.income>0 ? Math.max(3, Math.round(d.income/maxInc*92)) : 3;
    const cls = (d.day===current.getDate()) ? 'bar cur' : (d.income>0 ? 'bar has' : 'bar');
    bars += `<div class="${cls}" style="height:${h}px" title="${mo+1}/${d.day}　${money(d.income)}"></div>`;
  });
  html += `<div class="bars-cap">每日收入（${mo+1}月・橘色＝目前檢視的日期）</div><div class="bars">${bars}</div>`;
  document.getElementById('monthCard').innerHTML = html;
}

/* ===== 編輯面板 ===== */
const overlay=document.getElementById('overlay'), sheet=document.getElementById('sheet');
function buildPlatInputs(){
  document.getElementById('platInputs').innerHTML = PLATFORMS.map(pl=>`
    <div class="plat-block">
      <div class="head">${pl.logo}${pl.name}</div>
      <div class="duo">
        <div class="one"><div class="mini">收入</div><input type="number" inputmode="numeric" id="inc_${pl.key}" placeholder="0" min="0"><span class="unit" style="bottom:13px;top:auto">元</span></div>
        <div class="one"><div class="mini">單量</div><input type="number" inputmode="numeric" id="ord_${pl.key}" placeholder="0" min="0"><span class="unit" style="bottom:13px;top:auto">單</span></div>
      </div>
    </div>`).join('');
}
function openSheet(){
  const key=ymd(current); const rec=dayRecord(key);
  document.getElementById('sheetTitle').textContent = prettyDate(current);
  const totMin = Math.round(rec.hours*60);
  document.getElementById('in_h').value = rec.hours? Math.floor(totMin/60) : '';
  document.getElementById('in_m').value = rec.hours? (totMin%60) : '';
  document.getElementById('in_km').value = rec.km || '';
  document.getElementById('in_avgkm').value = getSettings().avgKmPerOrder || '';
  document.getElementById('in_fuel').value = rec.fuel || '';
  document.getElementById('in_cost').value = rec.other || '';
  PLATFORMS.forEach(pl=>{
    document.getElementById('inc_'+pl.key).value = rec.platforms[pl.key].income || '';
    document.getElementById('ord_'+pl.key).value = rec.platforms[pl.key].orders || '';
  });
  overlay.classList.add('show'); sheet.classList.add('show');
}
function closeSheet(){ overlay.classList.remove('show'); sheet.classList.remove('show'); }
function saveSheet(){
  const key=ymd(current);
  const h=+document.getElementById('in_h').value||0, m=+document.getElementById('in_m').value||0;
  const rec={ hours: h + m/60, km:+document.getElementById('in_km').value||0,
              fuel:+document.getElementById('in_fuel').value||0,
              other:+document.getElementById('in_cost').value||0, platforms:{} };
  PLATFORMS.forEach(pl=>{
    rec.platforms[pl.key]={ income:+document.getElementById('inc_'+pl.key).value||0,
                            orders:+document.getElementById('ord_'+pl.key).value||0 };
  });
  const s=getSettings(); s.avgKmPerOrder=+document.getElementById('in_avgkm').value||0; saveSettings(s);
  DATA[key]=rec; saveAll(DATA); closeSheet(); render();
}
function clearDay(){
  if(!confirm('確定要清除這天的所有資料嗎？')) return;
  delete DATA[ymd(current)]; saveAll(DATA); closeSheet(); render();
}

/* ===== 日報 / 月報 切換 ===== */
function setView(v){
  document.getElementById('dayView').style.display   = v==='day'  ? '' : 'none';
  document.getElementById('monthView').style.display = v==='month'? '' : 'none';
  document.getElementById('tabDay').classList.toggle('active', v==='day');
  document.getElementById('tabMonth').classList.toggle('active', v==='month');
}

/* ===== 匯出 / 匯入備份（CSV）===== */
const CSV_COLS = ['日期','工時(hr)','里程(km)','油錢','其他成本'];
PLATFORMS.forEach(pl=>{ CSV_COLS.push(pl.name+'收入'); CSV_COLS.push(pl.name+'單量'); });
function exportCSV(){
  const keys=Object.keys(DATA).sort();
  if(keys.length===0){ alert('還沒有任何資料可以匯出，先記幾天再來吧 🙂'); return; }
  const rows=[CSV_COLS.join(',')];
  keys.forEach(k=>{
    const r=dayRecord(k);
    const row=[k, r.hours||0, r.km||0, r.fuel||0, r.other||0];
    PLATFORMS.forEach(pl=>{ row.push(r.platforms[pl.key].income); row.push(r.platforms[pl.key].orders); });
    rows.push(row.join(','));
  });
  const blob=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='外送收入備份_'+ymd(new Date())+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function importCSV(file){
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const text=String(ev.target.result).replace(/^﻿/,'');
      const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
      if(lines.length<2) throw 0;
      const idx={}; lines[0].split(',').forEach((h,i)=>idx[h.trim()]=i);
      if(!('日期' in idx)) throw 0;
      const g=(c,name)=> name in idx ? (+c[idx[name]]||0) : 0;
      let added=0;
      for(let i=1;i<lines.length;i++){
        const c=lines[i].split(',');
        const date=(c[idx['日期']]||'').trim();
        if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
        const rec={ hours:g(c,'工時(hr)'), km:g(c,'里程(km)'), fuel:g(c,'油錢'), other:g(c,'其他成本'), platforms:{} };
        PLATFORMS.forEach(pl=>{ rec.platforms[pl.key]={ income:g(c,pl.name+'收入'), orders:g(c,pl.name+'單量') }; });
        DATA[date]=rec; added++;
      }
      saveAll(DATA); render();
      alert('匯入完成！共匯入 '+added+' 天的資料。');
    }catch(err){ alert('匯入失敗：檔案格式不正確。請使用本 App「匯出備份」產生的 CSV 檔。'); }
  };
  reader.readAsText(file);
}

/* ===== 事件 ===== */
document.getElementById('prevDay').onclick=()=>shiftDay(-1);
document.getElementById('nextDay').onclick=()=>shiftDay(1);
document.getElementById('todayBtn').onclick=()=>{ current=new Date(); render(); };
document.getElementById('editFab').onclick=openSheet;
document.getElementById('btnCancel').onclick=closeSheet;
document.getElementById('overlay').onclick=closeSheet;
document.getElementById('btnSave').onclick=saveSheet;
document.getElementById('btnClear').onclick=clearDay;
document.getElementById('tabDay').onclick=()=>setView('day');
document.getElementById('tabMonth').onclick=()=>setView('month');
document.getElementById('btnExport').onclick=exportCSV;
document.getElementById('btnImport').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=function(e){
  const f=e.target.files[0]; if(!f) return;
  if(confirm('匯入會覆蓋「相同日期」的資料，其他日期保留。確定匯入嗎？')) importCSV(f);
  e.target.value='';
};

buildPlatInputs();
setView('day');
render();
</script>
